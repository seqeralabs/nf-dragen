name: Release test on Seqera Platform
# Runs DRAGEN on a real F2 instance for release PRs (dev -> master), or by hand from the Actions tab.
# Each run costs F2 and DRAGEN time. Cancelling this job does not cancel the Platform run.
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SEQERA_API: https://api.cloud.seqera.io
  WORKSPACE_ID: "34830707738561" # seqeralabs/testing

jobs:
  dragen-f2:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # The run uses the Platform token and AWS account, so only people with write access may start it.
      # The repository has no outside collaborators, so write access means a Seqera org member.
      - name: Check the user can start a run
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) echo "$ACTOR has $permission access" ;;
            *) echo "::error::$ACTOR has '$permission' access; write access is needed to launch DRAGEN runs"; exit 1 ;;
          esac

      - uses: seqeralabs/action-seqera-launch@6854ad5e03f3be560f412a6d762d20448be468ca # v1.1.0
        id: launch
        with:
          access-token: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          workspace-id: ${{ env.WORKSPACE_ID }}
          compute-env: dragen-poc-f2-6x-ondemand-444-20261030
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          run-name: release_test_${{ github.event.pull_request.number || 'manual' }}_${{ github.run_id }}
          output-dir: s3://dragen-poc-511037203066/work/results/release-test/${{ github.run_id }}
          syntax-parser: v2
          nextflow-version: "26.10.6"
          parameters: |
            input: s3://dragen-poc-511037203066/work/data/samplesheet_hg002_2pair.csv
            dragen_index_dna: s3://dragen-poc-511037203066/work/references/hg38-pangenome-v5/
            dragen_index_rna: s3://dragen-poc-511037203066/work/references/hg38-pangenome-v5/
          # Launch config from the README "Seqera Platform" section; keep the two in sync.
          nextflow-config: |
            aws.batch.volumes = '/scratch/fusion:/tmp,/opt/edico,/var/lib/edico,/lib64/libdragen.so.4.4.4,/ephemeral'

            process {
                withLabel: 'dragen' {
                    containerOptions = '-e FUSION_CACHE_LOCATION=/ephemeral -e FUSION_COMPACT_SYMLINKS=true -e FUSION_STOP_SHUTDOWN_TIMEOUT=2h'
                    errorStrategy = { task.exitStatus in ((130..145) - 134) + 104 + Integer.MAX_VALUE ? 'retry' : 'finish' }
                    maxRetries = 3
                }
            }
          wait: running

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body \
            "DRAGEN release test launched on Seqera Platform for ${{ github.event.pull_request.head.sha }}: [${{ steps.launch.outputs.workflow-id }}](${{ steps.launch.outputs.workflow-url }}). Results in [this job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Wait for the run to finish
        timeout-minutes: 180
        env:
          TOKEN: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          WORKFLOW_ID: ${{ steps.launch.outputs.workflow-id }}
        run: |
          while true; do
            status=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "$SEQERA_API/workflow/$WORKFLOW_ID?workspaceId=$WORKSPACE_ID" | jq -r .workflow.status) || status="API error, retrying"
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|CANCELLED|UNKNOWN) echo "::error::Platform run $WORKFLOW_ID ended $status"; exit 1 ;;
            esac
            sleep 60
          done
