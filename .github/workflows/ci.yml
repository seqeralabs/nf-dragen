name: CI
on:
  push:
  pull_request:

env:
  NXF_VER: "26.10.6"
  NFT_VER: "0.9.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - run: nextflow lint .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFT_VER }}
      # Dummy DRAGEN licence secrets for the '-profile byol' stub test
      - run: |
          nextflow secrets set DRAGEN_USERNAME dummy-user
          nextflow secrets set DRAGEN_PASSWORD dummy-password
        env:
          NXF_SECRETS_FILE: ${{ runner.temp }}/secrets.json
      - run: nf-test test --ci
        env:
          NXF_SECRETS_FILE: ${{ runner.temp }}/secrets.json
