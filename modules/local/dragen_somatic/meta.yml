name: dragen_somatic
description: Run Illumina DRAGEN in somatic tumour/normal mode on one tumour and its normal, each read through a FASTQ list
keywords:
  - dragen
  - somatic
  - tumour/normal
  - variant calling
tools:
  - dragen:
      description: Illumina DRAGEN Bio-IT Platform, run from the AWS Marketplace pay-as-you-go DRAGEN AMI
      homepage: https://www.illumina.com/products/by-type/informatics-products/dragen-bio-it-platform.html
      licence: ["Commercial"]
input:
  - pair:
      type: record
      description: One tumour/normal pair; the lane fields are as in the dragen module, per sample
      fields:
        id:
          type: String
          description: Pair name (`<tumour>_vs_<normal>`); also the output file prefix
        tumour_id:
          type: String
          description: Tumour sample name; RGSM of the tumour FASTQ list
        tumour_lanes:
          type: List<String>
        tumour_fastq_1:
          type: List<Path>
        tumour_fastq_2:
          type: List<Path>
          description: Empty for single-end
        normal_id:
          type: String
          description: Normal sample name; RGSM of the normal FASTQ list
        normal_lanes:
          type: List<String>
        normal_fastq_1:
          type: List<Path>
        normal_fastq_2:
          type: List<Path>
          description: Empty for single-end
  - index:
      type: Path
      description: DRAGEN DNA hash table directory
  - target_bed:
      type: Path?
      description: Target regions BED, passed as `--vc-target-bed`, `--sv-call-regions-bed` and `--cnv-target-bed`; null for whole-genome
output:
  - pair:
      type: record
      description: DRAGEN outputs of the pair; every file is optional and depends on `ext.args`
      fields:
        id:
          type: String
        bam:
          type: List<Path>
          pattern: "${prefix}*.bam"
        bai:
          type: List<Path>
          pattern: "${prefix}*.bam.bai"
        vcf:
          type: Path
          pattern: "${prefix}.vcf.gz"
        tbi:
          type: Path
          pattern: "${prefix}.vcf.gz.tbi"
        vcf_filtered:
          type: Path
          pattern: "${prefix}.hard-filtered.vcf.gz"
        tbi_filtered:
          type: Path
          pattern: "${prefix}.hard-filtered.vcf.gz.tbi"
        sv_vcf:
          type: Path
          pattern: "${prefix}.sv.vcf.gz"
        sv_tbi:
          type: Path
          pattern: "${prefix}.sv.vcf.gz.tbi"
        cnv_vcf:
          type: Path
          pattern: "${prefix}.cnv.vcf.gz"
        cnv_tbi:
          type: Path
          pattern: "${prefix}.cnv.vcf.gz.tbi"
        metrics:
          type: List<Path>
          pattern: "${prefix}.*metrics.csv"
topics:
  - versions:
      type: Path
      pattern: versions.yml
notes: |
  Writes `tumour_fastq_list.csv` and `normal_fastq_list.csv` (one read group per lane, as in the dragen module) and
  passes them as `--tumor-fastq-list` and `--fastq-list`. It fails, naming the sample, when the numbers of R1 and R2
  files of a sample differ.
authors:
  - "@adamrtalbot"
